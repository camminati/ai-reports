name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is built and deployed by pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site and check sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python tools/build.py
      - name: SOURCES.md is up to date
        run: |
          for d in reports/*/; do
            if ls "$d"slides/src*.html >/dev/null 2>&1; then python tools/export_sources.py "$d"; fi
          done
          git diff --exit-code -- 'reports/*/SOURCES.md'

  layout:
    name: Slide layout check
    runs-on: ubuntu-latest
    continue-on-error: true   # informational until the checker has run on GitHub's fonts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Check every report
        run: |
          status=0
          for d in reports/*/; do python tools/check_layout.py "$d" || status=1; done
          exit $status
